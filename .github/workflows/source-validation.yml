name: Source validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, pinned 2026-10-29
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check source publication exclusions
        run: node launcher/tools/Check-Public-Source.mjs
      - name: Run host regression tests
        run: node launcher/tools/Test-Host.mjs
      - name: Audit reachable history
        run: node launcher/tools/Audit-History.mjs
      - name: Verify source archive creation
        run: node launcher/tools/Package-Public-Source.mjs
